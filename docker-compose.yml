version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: beriaka
        uid: 1000
    image: phaos-people-app
    container_name: phaos_people_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - phaos-network

  web:
    image: nginx:alpine
    container_name: phaos_people_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - phaos-network

  db:
    image: postgres:16-alpine
    container_name: phaos_people_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: phaos_people_db
      POSTGRES_USER: phaos_user
      POSTGRES_PASSWORD: secure_password_phaos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - phaos-network

networks:
  phaos-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
